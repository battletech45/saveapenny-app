name: saveapenny
description: "SaveAPenny - Personal finance management app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3

  # Data classes & JSON
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Networking
  dio: ^5.7.0

  # Navigation
  go_router: ^17.3.0

  # Storage
  flutter_secure_storage: ^10.3.1

  # Utilities
  intl: ^0.20.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code generation
  build_runner: ^2.4.14
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.9.4
  riverpod_generator: ^4.0.4

  # App tooling
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4

  # Testing
  mocktail: ^1.0.4
  golden_toolkit: ^0.15.0
  patrol: ^3.16.3

flutter:
  generate: true
  uses-material-design: true

